# =====================================================================
# Configuración de canal11-mail
# Copiar como config.properties (no se versiona) y completar.
# En el servidor tecnoweb todo va por localhost (ver docs/DECISIONES.md, D1).
# En el servidor: chmod 600 config.properties
# =====================================================================

# --- Buzón del sistema (POP3) ---
pop3.host=localhost
pop3.puerto=110
pop3.usuario=grupo14sa
pop3.contrasena=CAMBIAR

# --- Envío de respuestas (SMTP) ---
smtp.host=localhost
smtp.puerto=25
correo.direccion=grupo14sa@tecnoweb.org.bo

# --- Base de datos (PostgreSQL) ---
bd.url=jdbc:postgresql://localhost:5432/db_grupo14sa
bd.usuario=grupo14sa
bd.contrasena=CAMBIAR

# --- Aplicación (opcionales; estos son los valores por defecto) ---
app.intervalo_segundos=30
app.max_bytes_correo=1048576
app.timeout_segundos=30
app.zona_horaria=America/La_Paz
app.archivo_bloqueo=canal11.lock
app.carpeta_logs=logs
